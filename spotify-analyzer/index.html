<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>SoundStats</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
</head>

<body>

    <!-- Ambient Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Navigation -->
    <nav class="glass-nav">
        <div class="logo">SoundStats</div>
        <div class="nav-items">
            <button class="nav-btn active" data-target="view-overview">Overview</button>
            <button class="nav-btn" data-target="view-tracks">Tracks</button>
            <button class="nav-btn" data-target="view-artists">Artists</button>
            <button class="nav-btn" data-target="view-insights">Insights</button>
        </div>
    </nav>

    <main class="container">

        <!-- Login View -->
        <section id="login-section" class="view active-view">
            <div class="hero-card glass-panel">
                <div class="glitch-wrapper">
                    <h1 class="glitch" data-text="SoundStats">SoundStats</h1>
                </div>
                <p class="subtitle">Antigravity Edition</p>

                <form id="login-form">
                    <div class="input-group">
                        <input type="text" id="username-input" placeholder="Last.fm Username" autocomplete="off"
                            required>
                        <div class="input-border"></div>
                    </div>
                    <button type="submit" class="neon-btn">
                        <span>Connect</span>
                        <div class="btn-glow"></div>
                    </button>
                </form>

                <div class="divider"><span>OR</span></div>

                <div id="drop-zone" class="upload-zone">
                    <div class="icon">📂</div>
                    <p>Drop <code>StreamingHistory.json</code></p>
                </div>
                <input type="file" id="json-file-input" hidden accept=".json">
            </div>
        </section>

        <!-- Dashboard Container -->
        <div id="dashboard-container" class="hidden">

            <!-- Overview View -->
            <section id="view-overview" class="view active-view">
                <div class="profile-header glass-panel">
                    <div class="profile-content">
                        <div class="avatar-container">
                            <img id="user-avatar" src="assets/default-avatar.svg" alt="User" class="avatar">
                            <div class="avatar-glow"></div>
                        </div>
                        <div class="user-info">
                            <h2 id="user-name">Loading...</h2>
                            <div class="stat-badges">
                                <span class="badge">Scrobbling since <span id="user-since">-</span></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid-layout">
                    <!-- Recent Tracks -->
                    <div class="glass-panel tall-panel">
                        <h3><span class="pulse-dot"></span> Live Scrobbles</h3>
                        <ul id="recent-tracks-list" class="track-list">
                            <!-- JS Injected -->
                        </ul>
                    </div>
                </div>
            </section>

            <!-- Tracks View -->
            <section id="view-tracks" class="view hidden">
                <div class="glass-panel">
                    <div class="panel-header">
                        <h3>Top Tracks</h3>
                        <div class="time-filters">
                            <button class="filter-chip" data-period="7day">7D</button>
                            <button class="filter-chip" data-period="1month">1M</button>
                            <button class="filter-chip active" data-period="12month">1Y</button>
                            <button class="filter-chip" data-period="overall">All</button>
                        </div>
                    </div>
                    <div id="top-tracks-list" class="scroll-container">
                        <!-- JS Injected table -->
                    </div>
                </div>
            </section>

            <!-- Artists View -->
            <section id="view-artists" class="view hidden">
                <div class="glass-panel">
                    <h3>Top Artists</h3>
                    <div id="artist-list" class="artist-grid">
                        <!-- JS Injected -->
                    </div>
                </div>
            </section>

            <!-- Insights View -->
            <section id="view-insights" class="view hidden">
                <div class="grid-layout">
                    <div class="glass-panel">
                        <h3>Listening Clock</h3>
                        <div class="chart-container">
                            <canvas id="listeningClock"></canvas>
                        </div>
                    </div>
                    <div class="glass-panel">
                        <h3>Moods</h3>
                        <div class="chart-container">
                            <canvas id="moodChart"></canvas>
                        </div>
                    </div>
                    <div class="glass-panel full-width">
                        <h3>Genre Distribution</h3>
                        <div class="chart-container">
                            <canvas id="genrePieChart"></canvas>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script type="module" src="js/app.js"></script>
    <script>
        // Inline SW registration for simplicity
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(console.error);
        }
    </script>
</body>

</html>
